<svg xmlns="http://www.w3.org/2000/svg" width="820" height="196" viewBox="0 0 820 196" role="img" aria-labelledby="title desc"><title id="title">Contribution streak</title><desc id="desc">Total contributions --, current streak -- days, longest streak -- days.</desc><style>.num{animation:up .6s ease-out both}@keyframes up{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.ring{stroke-dashoffset:0;animation:ring 1.4s ease-out both}@keyframes ring{from{stroke-dashoffset:276.46}to{stroke-dashoffset:0}}@keyframes hb{0%,93.00%{opacity:0}93.01%,96.50%{opacity:1}96.51%,100%{opacity:0}}.hb{opacity:0;animation:hb 4.4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="1" y="1" width="818" height="194" rx="16" fill="#1E1E2E" stroke="#313244" stroke-width="2"/><line x1="273.33" y1="40" x2="273.33" y2="156" stroke="#45475A"/><line x1="546.67" y1="40" x2="546.67" y2="156" stroke="#45475A"/><text x="136.67" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#CDD6F4" text-anchor="middle" class="num" style="animation-delay:0.15s">--</text><text x="136.67" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#BAC2DE" text-anchor="middle">Total Contributions</text><text x="136.67" y="152" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#7F849C" text-anchor="middle">waiting for data</text><text x="683.33" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#CDD6F4" text-anchor="middle" class="num" style="animation-delay:0.45s">--</text><text x="683.33" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans