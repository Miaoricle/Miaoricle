x="133" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#B4BEFE" text-anchor="start" class="slz" style="animation-delay:0.9s">z</text><text x="148" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#B4BEFE" text-anchor="start" class="slz" style="animation-delay:1.8s">z</text><text x="330" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#CDD6F4" text-anchor="start">Thanks for stopping by!</text><text x="330" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#A6ADC8" text-anchor="start">Come back soon. The cat will still be here, probably asleep.</text><text x="330" y="176" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600"><tspan fill="#A6E3A1">$ </tspan><tspan fill="#CDD6F4">git commit -m &quot;see you next commit&quot;</tspan></text><rect class="cursor" x="668" y="163" width="8" height="16" fill="#CDD6F4"/></svg>
